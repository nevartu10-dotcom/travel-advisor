<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travel Advisor</title>
  <meta name="description" content="Trip cards with language, weather, plugs, safety, food, sights, news, holidays and phrases for your destination.">
  <meta name="theme-color" content="#14213D">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <h1 class="appbar-title" id="appbar-title"></h1>
    <span class="appbar-actions">
      <span class="appbar-status" id="net-status" data-i18n="offline" hidden></span>
      <button class="icon-btn" id="backup-btn" type="button" data-i18n-aria="aria.backup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.5A3.75 3.75 0 0 1 17.5 18H7Z"/><path d="M12 15V10m0 0-2.2 2.2M12 10l2.2 2.2"/></svg>
      </button>
      <button class="icon-btn profile-btn" id="profile-btn" type="button" data-i18n-aria="aria.profile">
        <span class="avatar" id="profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"/></svg>
        </span>
      </button>
    </span>
  </header>

  <main>
    <div class="welcome" id="welcome" role="status" hidden></div>

    <section class="view view-map" id="view-map" aria-labelledby="tab-map" role="tabpanel">
      <div id="map" class="map" data-i18n-aria="aria.mapOfTrips"></div>
      <form class="map-search" id="map-search" role="search" autocomplete="off">
        <label class="visually-hidden" for="map-q" data-i18n="search.label"></label>
        <input id="map-q" type="search" data-i18n-ph="search.placeholder" enterkeyhint="search" autocomplete="off" spellcheck="false">
        <button type="submit" data-i18n-aria="search.button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </button>
      </form>
      <div class="map-results" id="map-results" aria-live="polite"></div>
      <p class="map-hint" id="map-hint"></p>
    </section>

    <section class="view view-list" id="view-list" aria-labelledby="tab-list" role="tabpanel" hidden>
      <div class="list-wrap" id="trip-list"></div>
      <button class="fab" id="add-btn" type="button" data-i18n-aria="aria.addTrip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </section>
  </main>

  <nav class="tabbar" role="tablist" data-i18n-aria="aria.views">
    <button class="tab" id="tab-map" role="tab" aria-controls="view-map" data-view="map" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4Z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
      <span data-i18n="tab.map"></span>
    </button>
    <button class="tab" id="tab-list" role="tab" aria-controls="view-list" data-view="list" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span data-i18n="tab.list"></span>
    </button>
  </nav>

  <!-- New trip -->
  <dialog class="sheet" id="form-sheet" aria-labelledby="form-title">
    <form id="trip-form" class="sheet-inner" novalidate>
      <div class="sheet-head">
        <button class="icon-btn" type="button" data-close data-i18n-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <h2 id="form-title" data-i18n="form.title"></h2>
      </div>
      <div class="sheet-body form-body">
        <label class="field">
          <span><span data-i18n="form.name"></span> <small class="optional" data-i18n="form.optional"></small></span>
          <input name="name" id="f-name" maxlength="60" autocomplete="off" data-i18n-ph="form.namePh">
        </label>
        <fieldset class="field segmented-field">
          <legend data-i18n="form.type"></legend>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="type" value="holiday" checked><span data-i18n="type.holiday"></span></label>
            <label><input type="radio" name="type" value="business"><span data-i18n="type.business"></span></label>
          </div>
        </fieldset>
        <label class="field">
          <span data-i18n="form.country"></span>
          <input name="country" id="f-country" autocomplete="country-name" required data-i18n-ph="form.countryPh">
        </label>
        <label class="field">
          <span data-i18n="form.place"></span>
          <input name="place" id="f-place" autocomplete="off" required data-i18n-ph="form.placePh">
        </label>
        <button class="btn btn-quiet" type="button" id="f-find" data-i18n="form.find"></button>
        <div class="matches" id="f-matches" aria-live="polite"></div>
        <div class="field-row">
          <label class="field">
            <span data-i18n="form.arrival"></span>
            <input type="date" name="arrival" id="f-arrival" required>
          </label>
          <label class="field">
            <span data-i18n="form.departure"></span>
            <input type="date" name="departure" id="f-departure" required>
          </label>
        </div>
        <p class="form-error" id="f-error" role="alert"></p>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-primary" type="submit" id="f-submit" data-i18n="form.submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Trip card detail -->
  <dialog class="sheet sheet-detail" id="detail-sheet" aria-labelledby="d-city">
    <div class="sheet-inner" id="detail"></div>
  </dialog>

  <!-- Profile -->
  <dialog class="sheet" id="profile-sheet" aria-labelledby="profile-title">
    <form id="profile-form" class="sheet-inner" novalidate>
      <div class="sheet-head">
        <button class="icon-btn" type="button" data-close data-i18n-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <h2 id="profile-title" data-i18n="profile.title"></h2>
      </div>
      <div class="sheet-body form-body profile-body">
        <p class="muted" data-i18n="profile.intro"></p>
        <section class="stats" id="p-stats" aria-labelledby="p-stats-title"></section>
        <label class="field">
          <span data-i18n="profile.name"></span>
          <input id="p-name" maxlength="80" autocomplete="name">
        </label>
        <div class="field">
          <label for="p-address" data-i18n="profile.address"></label>
          <div class="field-inline">
            <input id="p-address" maxlength="200" autocomplete="street-address" data-i18n-ph="profile.addressPh">
            <button class="btn btn-quiet" type="button" id="p-find" data-i18n="profile.find"></button>
          </div>
          <p class="field-note" id="p-home" aria-live="polite"></p>
          <p class="field-note muted" data-i18n="profile.addressNote"></p>
        </div>
        <div class="field-row">
          <label class="field">
            <span data-i18n="profile.age"></span>
            <input id="p-age" type="number" inputmode="numeric" min="0" max="120" step="1">
          </label>
          <label class="field">
            <span data-i18n="profile.gender"></span>
            <select id="p-gender">
              <option value="" data-i18n="profile.gender.unset"></option>
              <option value="female" data-i18n="profile.gender.female"></option>
              <option value="male" data-i18n="profile.gender.male"></option>
              <option value="other" data-i18n="profile.gender.other"></option>
              <option value="none" data-i18n="profile.gender.none"></option>
            </select>
          </label>
        </div>
        <label class="field">
          <span data-i18n="profile.passport"></span>
          <input id="p-passport" type="date">
          <span class="field-note" id="p-passport-status"></span>
        </label>
        <label class="field">
          <span data-i18n="profile.language"></span>
          <select id="p-lang"></select>
          <span class="field-note muted" data-i18n="profile.langNote"></span>
        </label>
        <div class="field">
          <span class="field-label" data-i18n="profile.currency"></span>
          <p class="currency" id="p-currency"></p>
        </div>
        <p class="form-error" id="p-error" role="alert"></p>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-primary" type="submit" id="p-save" data-i18n="profile.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Backup and restore -->
  <dialog class="sheet sheet-small" id="backup-sheet" aria-labelledby="backup-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <button class="icon-btn" type="button" data-close data-i18n-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <h2 id="backup-title" data-i18n="backup.title"></h2>
      </div>
      <div class="sheet-body backup-body">
        <p data-i18n-html="backup.intro"></p>
        <p class="backup-status" id="backup-status"></p>
        <button class="btn btn-primary" type="button" id="backup-save" data-i18n="backup.save"></button>
        <h3 data-i18n="backup.restoreTitle"></h3>
        <p class="muted" data-i18n="backup.restoreText"></p>
        <button class="btn btn-quiet" type="button" id="backup-restore" data-i18n="backup.restoreBtn"></button>
        <input type="file" id="backup-file" accept=".json,application/json" hidden>
        <p class="source" id="persist-status"></p>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
